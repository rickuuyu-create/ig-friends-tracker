            "name": "Is this the same as Instagram Notes?",

          },

            "@type": "Question",
            "name": "Can I give an Instagram follower a nickname or their real name?",

            "name": "How do I remember where I met someone on Instagram?",

            }

            "name": "Where are my notes stored?",
            "acceptedAnswer": {
